{% extends "base.html" %}
{% block title %}New Entry — Personal Diary{% endblock %}

{% block content %}
<a href="{{ url_for('dashboard') }}" class="back-link">← Back to Dashboard</a>

<div class="card" style="max-width:720px;">
  <h1 class="page-title" style="margin-bottom:0.25rem;">New Diary Entry</h1>
  <p class="page-subtitle" style="margin-bottom:1.75rem;">Write your thoughts for today</p>

  <form method="POST" action="{{ url_for('create_note') }}">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" placeholder="Give your entry a title…" required />
    </div>

    <div class="form-group">
      <label for="mood">How are you feeling?</label>
      <select id="mood" name="mood">
        <option value="happy">😊 Happy</option>
        <option value="sad">😢 Sad</option>
        <option value="neutral" selected>😐 Neutral</option>
        <option value="excited">🤩 Excited</option>
        <option value="anxious">😰 Anxious</option>
        <option value="calm">😌 Calm</option>
      </select>
    </div>

    <div class="form-group">
      <label for="note-content">Your entry</label>
      <textarea id="note-content" name="content" placeholder="What's on your mind today?…"></textarea>
      <small id="char-counter" style="color:var(--text-muted);font-size:0.78rem;">0 characters</small>
    </div>

    <div style="display:flex;gap:0.75rem;">
      <button type="submit" class="btn btn-primary">Save Entry</button>
      <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
